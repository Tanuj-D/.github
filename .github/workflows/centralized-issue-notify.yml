name: Issue Notification for Non-Leidos Employees

on: 
  # Trigger when an issue is created
  issues: 
    types: [opened]
  
  # Trigger every 5 minutes
  schedule:
    - cron: "*/5 * * * *" # Runs every 5 minutes
jobs: 
  notify: 
    runs-on: ubuntu-22.04
    steps: 
      # Debug GitHub context
      - name: Print GitHub Context
        run: |
          echo "Workflow: ${{ github.workflow }}"
          echo "Action: ${{ github.action }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Issue Title: ${{ github.event.issue.title }}"
          echo "Issue Body: ${{ github.event.issue.body }}"

      # Step: Check if user is a Leidos employee
      - name: Check if user is a Leidos employee
        id: check_leidos
        uses: actions/github-script@v6
        with:
          script: |
            const issueBody = context.payload.issue.body;
            const isLeidosEmployee = issueBody.includes('Are you Saxton Lab/Leidos employee?') && 
                                      issueBody.includes('No'); 
            core.setOutput('notify', isLeidosEmployee ? 'true' : 'false');

      # Debug output from the previous step
      - name: Debug Notify Value
        run: |
          echo "Notify Value: ${{ steps.check_leidos.outputs.notify }}"

      # Email step
      - name: Debug Email Inputs
        if: steps.check_leidos.outputs.notify == 'true'
        run: |
          echo "Email will be sent to: devulapallitanuj@gmail.com"
          echo "Issue Title: ${{ github.event.issue.title }}"
          echo "Issue URL: ${{ github.event.issue.html_url }}"
          echo "Issue Description: ${{ github.event.issue.body }}"
      
      - name: Send Email Notification
        if: steps.check_leidos.outputs.notify == 'true'
        uses: dawidd6/action-send-mail@v3
        with: 
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "New Issue from Non-Leidos Employee"
          body: | 
            A new issue was created by a non-Leidos employee: 
            Title: ${{ github.event.issue.title }} 
            URL: ${{ github.event.issue.html_url }} 
            Description: ${{ github.event.issue.body }} 
          to: devulapallitanuj@gmail.com
          from: ${{ secrets.SMTP_USERNAME }}
